<div>
  <h2 id="page-heading" data-cy="OperationHeading">
    <span jhiTranslate="caissavance2App.operation.home.title">Operations</span>

    <div class="d-flex justify-content-end">
      <button class="btn btn-info me-2" (click)="load()" [disabled]="isLoading">
        <fa-icon icon="sync" [spin]="isLoading"></fa-icon>
        <span jhiTranslate="caissavance2App.operation.home.refreshListLabel">Refresh list</span>
      </button>

      <button
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="btn btn-primary jh-create-entity create-operation"
        [routerLink]="['/operation/new']"
      >
        <fa-icon icon="plus"></fa-icon>
        <span jhiTranslate="caissavance2App.operation.home.createLabel">Create a new Operation</span>
      </button>
    </div>
  </h2>

  <jhi-alert-error></jhi-alert-error>

  <jhi-alert></jhi-alert>
  <!-- --- FORMULAIRE AMÉLIORÉ (remplace ton <form> actuel par celui-ci) --- -->
  <form class="mb-3 col-md-3">
    <div class="card shadow-sm border-0 rounded-3">
      <div class="card-body p-2">
        <div class="row g-2 align-items-center">
          <!-- Champ de recherche -->
          <div class="col-12 col-md-8">
            <label class="visually-hidden" for="caisse-search">Recherche</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-0">
                <fa-icon icon="search"></fa-icon>
              </span>
              <input id="caisse-search" type="text" class="form-control" [formControl]="filter" placeholder="🔍 Rechercher..." />
            </div>
          </div>
        </div>
      </div>
    </div>
  </form>
  <!-- --- FIN FORMULAIRE AMÉLIORÉ --- -->

  <div class="alert alert-warning" id="no-result" *ngIf="operations?.length === 0">
    <span jhiTranslate="caissavance2App.operation.home.notFound">No Operations found</span>
  </div>

  <div class="table-responsive table-entities" id="entities" *ngIf="operations && operations.length > 0">
    <table class="table table-bordered" aria-describedby="page-heading">
      <thead>
        <tr jhiSort [(predicate)]="predicate" [(ascending)]="ascending" (sortChange)="navigateToWithComponentValues()">
          <th scope="col" jhiSortBy="numero">
            <div class="d-flex">
              <span jhiTranslate="caissavance2App.operation.numero">Numero</span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>
          <th scope="col" jhiSortBy="commentaire">
            <div class="d-flex">
              <span jhiTranslate="caissavance2App.operation.commentaire">Commentaire</span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>
          <th scope="col" jhiSortBy="montant">
            <div class="d-flex">
              <span jhiTranslate="caissavance2App.operation.montant">Montant</span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>

          <th scope="col" jhiSortBy="caisse.id">
            <div class="d-flex">
              <span jhiTranslate="caissavance2App.operation.caisse">Caisse</span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>
          <th scope="col" jhiSortBy="typeOperation.id">
            <div class="d-flex">
              <span jhiTranslate="caissavance2App.operation.typeOperation">Type Operation</span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>
          <th scope="col" jhiSortBy="modeOperation.id">
            <div class="d-flex">
              <span jhiTranslate="caissavance2App.operation.modeOperation">Mode Operation</span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>

          <th scope="col" jhiSortBy="action">
            <div class="d-flex">
              <span jhiTranslate="caissavance2App.operation.action">Action</span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>

          <th scope="col"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let operation of operations; trackBy: trackId" data-cy="entityTable">
          <td>{{ operation.numero }}</td>
          <td>{{ operation.commentaire }}</td>
          <td>{{ operation.montant }}</td>

          <td>
            <div *ngIf="operation.caisse">
              <a [routerLink]="['/caisse', operation.caisse.id, 'view']">{{ operation.caisse.libelle }}</a>
            </div>
          </td>
          <td>
            <div *ngIf="operation.typeOperation">
              <a [routerLink]="['/type-operation', operation.typeOperation.id, 'view']">{{ operation.typeOperation.libelle }}</a>
            </div>
          </td>
          <td>
            <div *ngIf="operation.modeOperation">
              <a [routerLink]="['/mode-operation', operation.modeOperation.id, 'view']">{{ operation.modeOperation.libelle }}</a>
            </div>
          </td>
          <td class="text-end">
            <div class="btn-group">
              <a [routerLink]="['/operation', operation.id, 'view']" class="btn btn-info btn-sm" data-cy="entityDetailsButton">
                <fa-icon icon="eye"></fa-icon>
                <span class="d-none d-md-inline"></span>
              </a>

              <a [routerLink]="['/operation', operation.id, 'edit']" class="btn btn-primary btn-sm mx-1" data-cy="entityEditButton">
                <fa-icon icon="pencil-alt"></fa-icon>
                <span class="d-none d-md-inline"></span>
              </a>

              <button type="submit" (click)="delete(operation)" class="btn btn-danger btn-sm" data-cy="entityDeleteButton">
                <fa-icon icon="times"></fa-icon>
                <span class="d-none d-md-inline"></span>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <div *ngIf="operations && operations.length > 0">
    <div class="d-flex justify-content-end p-2">
      <ngb-pagination
        [collectionSize]="collectionSize"
        [(page)]="page"
        [pageSize]="pageSize"
        [maxSize]="5"
        [rotate]="true"
        [boundaryLinks]="true"
        (pageChange)="applyFilterAndSort()"
      >
      </ngb-pagination>
    </div>
  </div>
</div>
