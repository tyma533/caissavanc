<div *ngIf="caisse" class="caisse-details">
  <h2 class="caisse-title">Détails de la caisse : {{ caisse.libelle }}</h2>
  <p class="caisse-solde">
    Solde actuel : <span>{{ caisse.solde | currency: 'EUR' }}</span>
  </p>

  <hr />

  <h3 class="depense-title">Effectuer une dépense</h3>
  <form class="depense-form" (ngSubmit)="effectuerDepense()">
    <div class="form-grid">
      <div class="form-group">
        <label>Montant :</label>
        <input type="number" [(ngModel)]="montant" name="montant" required />
      </div>

      <div class="form-group">
        <label>Commentaire :</label>
        <input type="text" [(ngModel)]="commentaire" name="commentaire" required />
      </div>

      <div class="form-group">
        <label>Mode d'opération :</label>
        <select [(ngModel)]="modeOperationId" name="modeOperationId">
          <option [value]="1">VIREMENT</option>
          <option [value]="2">CASH</option>
          <option [value]="3">CHEQUE</option>
          <option [value]="4">ESPECE</option>
        </select>
      </div>

      <!-- Champs toujours requis -->
      <div class="mb-3">
        <label for="beneficiaire">Bénéficiaire</label>
        <input id="beneficiaire" type="text" class="form-control" [(ngModel)]="beneficiaire" name="beneficiaire" />
      </div>

      <div class="mb-3">
        <label for="crediteur">Créditeur</label>
        <input id="crediteur" type="text" class="form-control" [(ngModel)]="crediteur" name="crediteur" />
      </div>

      <!-- Champs spécifiques VIREMENT / CHEQUE -->
      <!-- <div *ngIf="modeOperationId === 1 || modeOperationId === 3"> -->
      <div class="mb-3">
        <label for="numeroVC">Numéro Virement/Chèque</label>
        <input id="numeroVC" type="text" class="form-control" [(ngModel)]="numeroVC" name="numeroVC" />
      </div>

      <div class="mb-3">
        <label for="banque">Banque</label>
        <input id="banque" type="text" class="form-control" [(ngModel)]="banque" name="banque" />
      </div>
      <!-- </div> -->

      <div class="form-group"></div>
      <!-- Empty div to balance grid -->
    </div>

    <button type="submit" class="btn-depense">Effectuer la dépense</button>
  </form>
</div>
