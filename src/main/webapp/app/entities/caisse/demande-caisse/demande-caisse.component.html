<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>
      <fa-icon icon="list"></fa-icon>
      Demandes d’alimentation de la caisse {{ caisse?.libelle }}
    </h2>
    <button
      type="button"
      class="btn btn-success"
      [routerLink]="['/demande', 'new']"
      [queryParams]="{
        type: 'ALIMENTATION_CAISSE',
        caisseId: caisse?.id,
        etablissementId: caisse?.etablissement?.id,
        origine: 'caisse'
      }"
    >
      <fa-icon icon="plus" class="me-1"></fa-icon>
      Nouvelle demande d’alimentation
    </button>
  </div>

  <div *ngIf="isLoading" class="text-center mt-3"><fa-icon icon="spinner" [spin]="true"></fa-icon> Chargement en cours...</div>

  <table *ngIf="!isLoading && demandes.length > 0" class="table table-striped table-hover mt-3">
    <thead class="table-dark">
      <tr>
        <th>Type</th>
        <th>Montant</th>
        <th>État</th>
        <th>Objet</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let demande of demandes; trackBy: trackId">
        <td>{{ demande.type }}</td>
        <td>{{ demande.montant | number: '1.0-0' }} F CFA</td>
        <td>
          <span
            class="badge"
            [ngClass]="{
              'bg-success': demande.etat === ETATEXECUTEE,
              'bg-danger': demande.etat === ETATREFUSEE,
              'bg-warning text-dark': demande.etat === ETATEN_ATTENTE,
              'bg-primary': demande.etat === ETATVALIDEE
            }"
          >
            {{ demande.etat }}
          </span>
        </td>
        <td>{{ demande.objet }}</td>
        <td>
          <button class="btn btn-primary btn-sm" [routerLink]="['/demande', demande.id, 'view']">
            <fa-icon icon="eye"></fa-icon>
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!isLoading && demandes.length === 0" class="alert alert-info mt-4">Aucune demande d’alimentation pour cette caisse.</div>
  <!-- Bouton Retour à gauche -->
  <button type="submit" (click)="previousState()" class="btn btn-outline-secondary">
    <fa-icon icon="arrow-left"></fa-icon>&nbsp;Retour
  </button>
</div>
