<div *ngIf="caisse" class="caisse-details">
  <button type="submit" (click)="previousState()" class="btn btn-primary"><fa-icon icon="arrow-left"></fa-icon>&nbsp;</button>
  <h2 class="caisse-title">Détails de la caisse : {{ caisse.libelle }}</h2>
  <p class="caisse-solde">
    Solde actuel : <span>{{ caisse.solde | number: '1.0-0' }} FCFA</span>
  </p>

  <hr />

  <h3 class="depense-title">Effectuer une dépense</h3>

  <!-- Message si la caisse est clôturée -->
  <div *ngIf="caisse.etat === 'CLOTURE'" class="alert alert-warning mb-3">
    ⚠️ Cette caisse est clôturée, vous ne pouvez pas effectuer de dépense.
  </div>

  <form *ngIf="caisse.etat !== 'CLOTURE'" class="depense-form" (ngSubmit)="effectuerDepense()">
    <div class="form-grid">
      <div class="form-group">
        <label>Montant :</label>
        <input type="number" [(ngModel)]="montant" name="montant" required />
      </div>

      <div class="form-group">
        <label>Commentaire :</label>
        <input type="text" [(ngModel)]="commentaire" name="commentaire" required />
      </div>

      <div class="form-group">
        <label>Mode d'opération :</label>
        <select [(ngModel)]="modeOperationId" name="modeOperationId">
          <option [value]="1">VIREMENT</option>
          <option [value]="3">CHEQUE</option>
          <option [value]="4">ESPECE</option>
        </select>
      </div>

      <!-- Champs toujours requis -->
      <div class="mb-3">
        <label for="beneficiaire">Bénéficiaire</label>
        <input id="beneficiaire" type="text" class="form-control" [(ngModel)]="beneficiaire" name="beneficiaire" />
      </div>

      <!-- Champs spécifiques VIREMENT / CHEQUE -->
      <div class="mb-3">
        <label for="numeroVC">Numéro Virement/Chèque</label>
        <input id="numeroVC" type="text" class="form-control" [(ngModel)]="numeroVC" name="numeroVC" />
      </div>

      <div class="mb-3">
        <label for="banque">Banque</label>
        <input id="banque" type="text" class="form-control" [(ngModel)]="banque" name="banque" />
      </div>

      <!-- Champ Pièce justificative -->
      <div class="mb-3">
        <label for="piece">Pièce justificative :</label>

        <div *ngIf="piece" class="form-text text-danger clearfix">
          <a (click)="openFile(piece, pieceContentType)" class="btn btn-link p-0">📎 Ouvrir</a>
          <span>{{ pieceContentType }}, {{ byteSize(piece) }}</span>
          <button type="button" (click)="removePiece()" class="btn btn-secondary btn-sm float-end">
            <fa-icon icon="times"></fa-icon> Supprimer
          </button>
        </div>

        <input type="file" id="piece" (change)="setFileData($event)" />
      </div>

      <div class="form-group"></div>
    </div>

    <!-- Erreur renvoyée par le backend -->
    <div *ngIf="erreurMessage" class="alert alert-danger">
      {{ erreurMessage }}
    </div>

    <button type="submit" class="btn-depense" [disabled]="caisse.etat?.toString() === 'CLOTURE'">Effectuer la dépense</button>
  </form>
</div>
