<div class="d-flex justify-content-center">
  <div class="col-8">
    <div *ngIf="caisse" class="caisse-details">
      <h2 data-cy="caisseDetailsHeading">
        <span jhiTranslate="caissavance2App.caisse.detail.title">Caisse</span>
      </h2>

      <hr />

      <!-- <div class="detail-row">
        <div class="label">ID</div>
        <div class="value">{{ caisse.id }}</div>
      </div> -->
      <div class="detail-row">
        <div class="label">Gérant</div>
        <div class="value">{{ caisse.gerantActif }}</div>
      </div>

      <div class="detail-row">
        <div class="label">Libelle</div>
        <div class="value">{{ caisse.libelle }}</div>
      </div>

      <div class="detail-row">
        <div class="label">Date Creation</div>
        <div class="value">{{ caisse.dateCreationCaisse | formatMediumDatetime }}</div>
      </div>

      <div class="detail-row">
        <div class="label">Solde</div>
        <div class="value">{{ caisse.solde }}</div>
      </div>

      <div class="detail-row">
        <div class="label">Etat</div>
        <div class="value">
          <span jhiTranslate="{{ 'caissavance2App.EtatCaisse.' + caisse.etat }}">{{ caisse.etat }}</span>
        </div>
      </div>

      <div class="detail-row">
        <div class="label">Etablissement</div>
        <div class="value">
          <div *ngIf="caisse.etablissement">
            <a [routerLink]="['/etablissement', caisse.etablissement.id, 'view']">{{ caisse.etablissement.libelle }}</a>
          </div>
        </div>
      </div>

      <button type="submit" (click)="previousState()" class="btn btn-info"><fa-icon icon="arrow-left"></fa-icon>&nbsp;Back</button>

      <button type="button" [routerLink]="['/caisse', caisse.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;Edit
      </button>

      <button
        type="button"
        [routerLink]="['/caisse', caisse.id, 'affectation']"
        [disabled]="isCaisseFermee"
        class="btn btn-secondary btn-sm mx-1"
        data-cy="entityAffectationButton"
      >
        <fa-icon icon="tasks"></fa-icon>
        <span class="d-none d-md-inline">Affectation</span>
      </button>

      <button
        type="button"
        [routerLink]="['/caisse', caisse.id, 'depense']"
        [disabled]="isCaisseFermee"
        class="btn btn-warning btn-sm mx-1"
        data-cy="entityDepenseButton"
      >
        <fa-icon icon="tasks"></fa-icon>
        <span class="d-none d-md-inline">Dépense</span>
      </button>

      <button
        type="button"
        [disabled]="caisse.etat?.toString() === 'CLOTURE'"
        class="btn btn-warning me-2"
        [routerLink]="['/demande', 'new']"
        [queryParams]="{
          type: 'ALIMENTATION_CAISSE',
          caisseId: caisse.id,
          etablissementId: caisse.etablissement?.id,
          origine: 'caisse'
        }"
      >
        Alimenter la caisse
      </button>

      <button
        type="button"
        [disabled]="caisse.etat?.toString() === 'CLOTURE'"
        class="btn btn-success me-2"
        [routerLink]="['/gerant-caisse', 'new']"
        [queryParams]="{ caisseId: caisse.id }"
      >
        <fa-icon icon="user-plus"></fa-icon>
        Affecter un gérant
      </button>

      <!-- Bouton clôture ou réouverture -->
      <button
        type="button"
        class="btn btn-danger me-2"
        [routerLink]="['/demande', 'new']"
        [queryParams]="{
          type: caisse.etat?.toString() === 'OUVERTE' ? 'CLOTURE_CAISSE' : 'REOUVERTURE_CAISSE',
          caisseId: caisse.id,
          etablissementId: caisse.etablissement?.id,
          origine: 'caisse'
        }"
      >
        {{ caisse.etat?.toString() === 'OUVERTE' ? 'Demande de clôture' : 'Demande de réouverture' }}
      </button>
    </div>
  </div>
</div>

<hr />
