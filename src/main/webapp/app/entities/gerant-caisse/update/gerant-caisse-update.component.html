<div class="d-flex justify-content-center py-5">
  <div class="col-md-6">
    <div class="card border-primary shadow-lg rounded-4">
      <div class="card-header bg-primary text-white">
        <h3 class="mb-0" id="jhi-gerant-caisse-heading" data-cy="GerantCaisseCreateUpdateHeading">Créer / Modifier une Affectation</h3>
      </div>

      <div class="card-body p-4">
        <jhi-alert-error></jhi-alert-error>

        <form [formGroup]="editForm" (ngSubmit)="save()" novalidate>
          <!-- ID -->
          <div class="mb-4" *ngIf="editForm.controls.id.value !== null">
            <label class="form-label fw-bold" for="field_id">ID</label>
            <input type="number" class="form-control" id="field_id" formControlName="id" readonly />
          </div>

          <!-- Actif -->
          <div class="form-check form-switch mb-4">
            <input type="checkbox" class="form-check-input" id="field_actif" formControlName="actif" />
            <label class="form-check-label fw-bold" for="field_actif">Actif</label>
          </div>

          <!-- Select Caisse -->
          <div class="mb-4">
            <label class="form-label fw-bold" for="field_caisse">Caisse</label>
            <select class="form-select" id="field_caisse" formControlName="caisse" [compareWith]="compareCaisse">
              <option [ngValue]="null">-- Sélectionnez une caisse --</option>
              <option *ngFor="let caisseOption of caissesSharedCollection" [ngValue]="caisseOption">
                {{ caisseOption.libelle }}
              </option>
            </select>
          </div>

          <!-- Select Gérants -->
          <div class="mb-4">
            <label class="form-label fw-bold" for="field_gerant">Gérant</label>
            <select class="form-select" id="field_gerant" formControlName="gerant" [compareWith]="compareGerant">
              <option [ngValue]="null">-- Sélectionnez un gérant --</option>
              <option *ngFor="let gerantOption of gerantsSharedCollection" [ngValue]="gerantOption">
                {{ gerantOption.nom }}
              </option>
            </select>
          </div>

          <!-- Boutons -->
          <div class="d-flex justify-content-end gap-3 mt-4">
            <button type="button" class="btn btn-outline-secondary" (click)="previousState()">
              <fa-icon icon="ban"></fa-icon> Annuler
            </button>
            <button type="submit" class="btn btn-primary" [disabled]="editForm.invalid || isSaving">
              <fa-icon icon="save"></fa-icon> Enregistrer
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
