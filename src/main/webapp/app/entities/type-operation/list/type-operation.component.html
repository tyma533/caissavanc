<div>
  <h2 id="page-heading" data-cy="TypeOperationHeading">
    <span jhiTranslate="caissavance2App.typeOperation.home.title">Type Operations</span>

    <div class="d-flex justify-content-end">
      <button class="btn btn-info me-2" (click)="load()" [disabled]="isLoading">
        <fa-icon icon="sync" [spin]="isLoading"></fa-icon>
        <span jhiTranslate="caissavance2App.typeOperation.home.refreshListLabel">Refresh list</span>
      </button>

      <button
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="btn btn-primary jh-create-entity create-type-operation"
        [routerLink]="['/type-operation/new']"
      >
        <fa-icon icon="plus"></fa-icon>
        <span jhiTranslate="caissavance2App.typeOperation.home.createLabel">Create a new Type Operation</span>
      </button>
    </div>
  </h2>

  <jhi-alert-error></jhi-alert-error>

  <jhi-alert></jhi-alert>
  <form class="mb-3 col-md-3">
    <div class="input-group">
      <input type="text" class="form-control w-10" [formControl]="filter" placeholder="Rechercher..." />
    </div>
  </form>

  <div class="alert alert-warning" id="no-result" *ngIf="typeOperations?.length === 0">
    <span jhiTranslate="caissavance2App.typeOperation.home.notFound">No Type Operations found</span>
  </div>

  <div class="table-responsive table-entities" id="entities" *ngIf="typeOperations && typeOperations.length > 0">
    <table class="table table-striped" aria-describedby="page-heading">
      <thead>
        <tr jhiSort [(predicate)]="predicate" [(ascending)]="ascending" (sortChange)="navigateToWithComponentValues()">
          <th scope="col" jhiSortBy="id">
            <div class="d-flex">
              <span jhiTranslate="global.field.id"></span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>
          <th scope="col" jhiSortBy="libelle">
            <div class="d-flex">
              <span jhiTranslate="caissavance2App.typeOperation.libelle">Libelle</span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>

          <th scope="col"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let typeOperation of typeOperations; trackBy: trackId" data-cy="entityTable">
          <td>
            <a [routerLink]="['/type-operation', typeOperation.id, 'view']">{{ typeOperation.id }}</a>
          </td>
          <td>{{ typeOperation.libelle }}</td>

          <td class="text-end">
            <div class="btn-group">
              <a [routerLink]="['/type-operation', typeOperation.id, 'view']" class="btn btn-info btn-sm" data-cy="entityDetailsButton">
                <fa-icon icon="eye"></fa-icon>
                <span class="d-none d-md-inline"></span>
              </a>

              <a [routerLink]="['/type-operation', typeOperation.id, 'edit']" class="btn btn-primary btn-sm" data-cy="entityEditButton">
                <fa-icon icon="pencil-alt"></fa-icon>
                <span class="d-none d-md-inline"></span>
              </a>

              <button type="submit" (click)="delete(typeOperation)" class="btn btn-danger btn-sm" data-cy="entityDeleteButton">
                <fa-icon icon="times"></fa-icon>
                <span class="d-none d-md-inline"></span>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
