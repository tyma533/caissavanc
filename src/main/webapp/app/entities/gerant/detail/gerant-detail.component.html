<div class="d-flex justify-content-center">
  <div class="col-8">
    <div *ngIf="gerant">
      <h2 data-cy="gerantDetailsHeading"><span jhiTranslate="caissavance2App.gerant.detail.title">Gerant</span></h2>

      <hr />

      <jhi-alert-error></jhi-alert-error>

      <jhi-alert></jhi-alert>

      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="global.field.id">ID</span></dt>
        <dd>
          <span>{{ gerant.id }}</span>
        </dd>
        <dt><span jhiTranslate="caissavance2App.gerant.nom">Nom</span></dt>
        <dd>
          <span>{{ gerant.nom }}</span>
        </dd>
        <dt><span jhiTranslate="caissavance2App.gerant.dateNomination">Date Nomination</span></dt>
        <dd>
          <span>{{ gerant.dateNomination | formatMediumDatetime }}</span>
        </dd>
        <dt><span jhiTranslate="caissavance2App.gerant.dateFin">Date Fin</span></dt>
        <dd>
          <span>{{ gerant.dateFin | formatMediumDatetime }}</span>
        </dd>

        <dt><span jhiTranslate="caissavance2App.gerant.agentEtatProfil">Agent Etat Profil</span></dt>
        <dd>
          <div *ngIf="gerant.agentEtatProfil">
            <a [routerLink]="['/agent-etat-profil', gerant.agentEtatProfil.id, 'view']">{{ gerant.agentEtatProfil.id }}</a>
          </div>
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
      </button>

      <button type="button" [routerLink]="['/gerant', gerant.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
      </button>
    </div>
  </div>
</div>
