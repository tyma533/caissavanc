<div>
  <h2 id="page-heading" data-cy="ControleHeading">
    <span jhiTranslate="caissavance2App.controle.home.title">Controles</span>

    <div class="d-flex justify-content-end">
      <button class="btn btn-info me-2" (click)="load()" [disabled]="isLoading">
        <fa-icon icon="sync" [spin]="isLoading"></fa-icon>
        <span jhiTranslate="caissavance2App.controle.home.refreshListLabel">Refresh list</span>
      </button>

      <button
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="btn btn-primary jh-create-entity create-controle"
        [routerLink]="['/controle/new']"
      >
        <fa-icon icon="plus"></fa-icon>
        <span jhiTranslate="caissavance2App.controle.home.createLabel">Create a new Controle</span>
      </button>
    </div>
  </h2>

  <jhi-alert-error></jhi-alert-error>

  <jhi-alert></jhi-alert>

  <form class="mb-3 col-md-3">
    <div class="input-group">
      <input type="text" class="form-control w-10" [formControl]="filter" placeholder="Rechercher..." />
    </div>
  </form>
  <div class="alert alert-warning" id="no-result" *ngIf="controles?.length === 0">
    <span jhiTranslate="caissavance2App.controle.home.notFound">No Controles found</span>
  </div>

  <div class="table-responsive table-entities" id="entities" *ngIf="controles && controles.length > 0">
    <table class="table table-striped" aria-describedby="page-heading">
      <thead>
        <tr jhiSort [(predicate)]="predicate" [(ascending)]="ascending" (sortChange)="navigateToWithComponentValues()">
          <th scope="col" jhiSortBy="id">
            <div class="d-flex">
              <span jhiTranslate="global.field.id"></span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>
          <th scope="col" jhiSortBy="dateControle">
            <div class="d-flex">
              <span jhiTranslate="caissavance2App.controle.dateControle">Date Controle</span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>
          <th scope="col" jhiSortBy="observation">
            <div class="d-flex">
              <span jhiTranslate="caissavance2App.controle.observation">Observation</span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>

          <th scope="col" jhiSortBy="caisse.id">
            <div class="d-flex">
              <span jhiTranslate="caissavance2App.controle.caisse">Caisse</span>
              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>
          <th scope="col"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let controle of controles; trackBy: trackId" data-cy="entityTable">
          <td>
            <a [routerLink]="['/controle', controle.id, 'view']">{{ controle.id }}</a>
          </td>
          <td>{{ controle.dateControle | formatMediumDatetime }}</td>
          <td>{{ controle.observation }}</td>

          <td>
            <div *ngIf="controle.caisse">
              <a [routerLink]="['/caisse', controle.caisse.id, 'view']">{{ controle.caisse.id }}</a>
            </div>
          </td>
          <td class="text-end">
            <div class="btn-group">
              <a [routerLink]="['/controle', controle.id, 'view']" class="btn btn-info btn-sm" data-cy="entityDetailsButton">
                <fa-icon icon="eye"></fa-icon>
                <span class="d-none d-md-inline"></span>
              </a>

              <a [routerLink]="['/controle', controle.id, 'edit']" class="btn btn-primary btn-sm mx-1" data-cy="entityEditButton">
                <fa-icon icon="pencil-alt"></fa-icon>
                <span class="d-none d-md-inline"></span>
              </a>

              <button type="submit" (click)="delete(controle)" class="btn btn-danger btn-sm" data-cy="entityDeleteButton">
                <fa-icon icon="times"></fa-icon>
                <span class="d-none d-md-inline"></span>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <div *ngIf="controles && controles.length > 0">
    <div class="d-flex justify-content-end p-2">
      <ngb-pagination
        [collectionSize]="collectionSize"
        [(page)]="page"
        [pageSize]="pageSize"
        [maxSize]="5"
        [rotate]="true"
        [boundaryLinks]="true"
        (pageChange)="applyFilterAndSort()"
      >
      </ngb-pagination>
    </div>
  </div>
</div>
