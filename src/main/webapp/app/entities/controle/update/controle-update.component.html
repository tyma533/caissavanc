<div class="d-flex justify-content-center mt-4">
  <div class="col-10">
    <!-- 🔹 Bandeau d'information sur la caisse -->
    <div *ngIf="caisse" class="alert alert-info shadow-sm mb-4 rounded-3">
      <h4 class="mb-2 text-primary">
        <fa-icon icon="briefcase"></fa-icon>
        &nbsp;Contrôle de la caisse : <strong>{{ caisse.libelle }}</strong>
      </h4>
      <p class="mb-1"><strong>Gérant :</strong> {{ caisse.gerantActif }}</p>
      <p class="mb-1"><strong>Solde actuel :</strong> {{ caisse.solde | number: '1.0-0' }} FCFA</p>
      <p class="mb-0"><strong>État :</strong> {{ caisse.etat }}</p>
    </div>

    <!-- 🔹 Formulaire de création ou d’édition du contrôle -->
    <form [formGroup]="editForm" (ngSubmit)="save()" novalidate class="card shadow-sm border-0 p-4">
      <h3 class="text-center mb-4 text-primary">
        <fa-icon icon="clipboard-check"></fa-icon>&nbsp;
        {{ editForm.get('id')?.value ? 'Modifier un contrôle' : 'Nouveau contrôle' }}
      </h3>

      <jhi-alert-error></jhi-alert-error>

      <!-- Date du contrôle -->
      <div class="mb-3">
        <label for="field_dateControle" class="form-label fw-semibold"> Date du contrôle </label>
        <input
          id="field_dateControle"
          type="datetime-local"
          class="form-control"
          formControlName="dateControle"
          placeholder="YYYY-MM-DD HH:mm"
        />
      </div>

      <!-- Observation -->
      <div class="mb-3">
        <label for="field_observation" class="form-label fw-semibold"> Observation </label>
        <textarea
          id="field_observation"
          rows="3"
          class="form-control"
          formControlName="observation"
          placeholder="Saisissez vos remarques ici..."
        ></textarea>
      </div>

      <!-- Résultat du contrôle -->
      <div class="mb-4">
        <label class="form-label fw-semibold">Résultat du contrôle</label>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" formControlName="conforme" id="conforme" />
          <label class="form-check-label" for="conforme">Conforme</label>
        </div>
      </div>

      <!-- Caisse liée (lecture seule si déjà connue) -->
      <div class="mb-3" *ngIf="!caisse">
        <label class="form-label fw-semibold" for="field_caisse">Caisse</label>
        <select class="form-select" id="field_caisse" data-cy="caisse" name="caisse" formControlName="caisse" [compareWith]="compareCaisse">
          <option [ngValue]="null">-- Sélectionner une caisse --</option>
          <option *ngFor="let caisseOption of caissesSharedCollection" [ngValue]="caisseOption">
            {{ caisseOption.libelle }}
          </option>
        </select>
      </div>

      <!-- Boutons d’action -->
      <div class="text-center mt-4">
        <button type="button" class="btn btn-secondary me-2" (click)="previousState()">
          <fa-icon icon="arrow-left"></fa-icon>&nbsp;Annuler
        </button>

        <button type="submit" class="btn btn-success" [disabled]="editForm.invalid || isSaving">
          <fa-icon icon="save"></fa-icon>&nbsp;{{ isSaving ? 'Enregistrement...' : 'Enregistrer' }}
        </button>
      </div>
    </form>
  </div>
</div>
