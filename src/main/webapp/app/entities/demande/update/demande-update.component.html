<div class="demande-details">
  <h2 class="demande-title">
    {{ demande?.id ? 'Modifier la Demande' : 'Créer une Demande' }}
  </h2>

  <hr />

  <form class="demande-form" [formGroup]="editForm" (ngSubmit)="save()">
    <div class="form-grid">
      <!-- Type -->
      <div class="form-group">
        <label>Type</label>
        <select formControlName="type">
          <option [ngValue]="null">Sélectionner un type</option>
          <option *ngFor="let type of typeValues" [ngValue]="type">{{ type }}</option>
        </select>
      </div>

      <!-- Établissement -->
      <div class="form-group">
        <label>Établissement demandeur</label>
        <select formControlName="etablissement" [compareWith]="compareEtab">
          <option [ngValue]="null">Sélectionner un établissement</option>
          <option *ngFor="let etab of etablissementsSharedCollection" [ngValue]="etab">{{ etab.libelle }}</option>
        </select>
      </div>

      <!-- L'intitulé de la caisse pour CREATION_CAISSE -->
      <div class="form-group" *ngIf="editForm.get('type')?.value === 'CREATION_CAISSE'">
        <label>L'intitulé de la caisse</label>
        <input type="text" formControlName="intitule" placeholder="L'intitulé de la caisse" />
      </div>

      <div
        class="form-group"
        *ngIf="['ALIMENTATION_CAISSE', 'CLOTURE_CAISSE', 'REOUVERTURE_CAISSE'].includes(editForm.get('type')?.value || '')"
      >
        <label>
          Caisse
          <span *ngIf="editForm.get('type')?.value === 'ALIMENTATION_CAISSE'">à alimenter</span>
          <span *ngIf="editForm.get('type')?.value === 'CLOTURE_CAISSE'">à clôturer</span>
          <span *ngIf="editForm.get('type')?.value === 'REOUVERTURE_CAISSE'">à rouvrir</span>
        </label>
        <select formControlName="caisseId">
          <option [ngValue]="null">Sélectionner une caisse</option>
          <option *ngFor="let caisse of filteredCaisses" [ngValue]="caisse.id">
            {{ caisse.libelle }} (Solde: {{ caisse.solde || 0 }})
          </option>
        </select>

        <!-- Montant uniquement pour alimentation -->
        <div *ngIf="editForm.get('type')?.value === 'ALIMENTATION_CAISSE'">
          <label>Montant à alimenter</label>
          <input type="number" formControlName="montant" placeholder="Montant" min="0" required />
        </div>
      </div>

      <!-- Objet -->
      <div class="form-group">
        <label>Objet</label>
        <textarea formControlName="objet" placeholder="Entrez un objet" required></textarea>
      </div>
    </div>

    <button type="submit" class="btn-demande" [disabled]="editForm.invalid || isSaving">Enregistrer</button>
  </form>
</div>
