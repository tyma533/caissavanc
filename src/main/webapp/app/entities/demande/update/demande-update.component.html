<div class="demande-details">
  <h2 class="demande-title">
    {{ demande?.id ? 'Modifier la Demande' : 'Créer une Demande' }}
  </h2>

  <hr />

  <form class="demande-form" [formGroup]="editForm" (ngSubmit)="save()">
    <div class="form-grid">
      <!-- Objet -->
      <div class="form-group">
        <label>Objet</label>
        <select formControlName="objet">
          <option [ngValue]="null">Sélectionner un objet</option>
          <option *ngFor="let objet of objetValues" [ngValue]="objet">{{ objet }}</option>
        </select>
      </div>

      <!-- Établissement -->
      <div class="form-group">
        <label>Établissement demandeur</label>
        <select formControlName="etablissement">
          <option [ngValue]="null">Sélectionner un établissement</option>
          <option *ngFor="let etab of etablissementsSharedCollection" [ngValue]="etab">{{ etab.libelle }}</option>
        </select>
      </div>

      <!-- Libellé de la caisse pour CREATION_CAISSE -->
      <div class="form-group" *ngIf="editForm.get('objet')?.value === 'CREATION_CAISSE'">
        <label>Libellé de la caisse</label>
        <input type="text" formControlName="libelle" placeholder="Libellé de la caisse" />
      </div>

      <!-- Sélection de la caisse pour ALIMENTATION_CAISSE -->
      <div class="form-group" *ngIf="editForm.get('objet')?.value === 'ALIMENTATION_CAISSE'">
        <label>Caisse à alimenter</label>
        <select formControlName="caisseId">
          <option [ngValue]="null">Sélectionner une caisse</option>
          <option *ngFor="let caisse of filteredCaisses" [ngValue]="caisse.id">
            {{ caisse.libelle }} (Solde: {{ caisse.solde || 0 }})
          </option>
        </select>

        <label>Montant à alimenter</label>
        <input type="number" formControlName="montant" placeholder="Montant" min="0" required />
      </div>

      <!-- Commentaire -->
      <div class="form-group">
        <label>Commentaire</label>
        <textarea formControlName="commentaire" placeholder="Entrez un commentaire"></textarea>
      </div>
    </div>

    <button type="submit" class="btn-demande" [disabled]="editForm.invalid || isSaving">Enregistrer</button>
  </form>
</div>
